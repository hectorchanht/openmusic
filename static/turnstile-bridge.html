<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Turnstile</title>
<style>html,body{margin:0;background:transparent;overflow:hidden}</style>
<script>
// Turnstile bridge (quick-260926-ot5): the Android app (WebView origin https://localhost) frames
// this page so the widget runs on the real hostname and siteverify reports openmusic.lol. The token
// goes back to the parent over postMessage. Served by the Pages asset layer (excluded from the
// worker by _routes.json), so the root _headers frame-ancestors rule applies to it.
// Defined BEFORE the async loader below: that script may run before a later inline script parses.
'use strict';
// The Capacitor Android WebView origin and the future iOS one. Hard-coded: the page has no config.
var ALLOWED = ['https://localhost', 'capacitor://localhost'];
var parentWin = null, parentOrigin = null, token = '', widgetId = null;

// The ONLY postMessage call site; targetOrigin is always the remembered parent origin.
function send(msg) { if (parentWin && parentOrigin) parentWin.postMessage(msg, parentOrigin); }

window.addEventListener('message', function (e) {
	if (ALLOWED.indexOf(e.origin) < 0 || e.source !== window.parent) return;
	var d = e.data || {};
	if (d.type === 'om-ts-hello') {
		parentWin = e.source;
		parentOrigin = e.origin;
		// A token solved before the parent's onload fired is held until this hello, then sent.
		if (token) send({ type: 'om-ts-token', token: token });
	} else if (d.type === 'om-ts-reset' && e.source === parentWin && widgetId !== null && window.turnstile) {
		token = ''; // single-use: the parent spent it
		window.turnstile.reset(widgetId);
	}
});

window.omTsReady = function () {
	// sitekey = TURNSTILE_SITEKEY, action = the server's TURNSTILE_ACTION; theme/size mirror the web widget.
	widgetId = window.turnstile.render('#ts', {
		sitekey: '0x4AAAAAAFEvje1fGyRJgFd2',
		action: 'comment',
		theme: 'auto',
		size: 'flexible',
		callback: function (t) { token = t; send({ type: 'om-ts-token', token: t }); },
		'expired-callback': function () { token = ''; send({ type: 'om-ts-clear' }); },
		'error-callback': function () { token = ''; send({ type: 'om-ts-clear' }); }
	});
};
</script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=omTsReady" async defer></script>
</head>
<body><div id="ts"></div></body>
</html>
