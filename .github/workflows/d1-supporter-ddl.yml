name: d1-supporter-ddl
# One-purpose maintenance workflow (quick-261119-tipbind): apply the
# account_supporters DDL to the openmusic-accounts D1 (ACCOUNTS_DB) and verify
# the table exists. The SQL is FIXED in this file — no inputs — so a dispatch
# can only ever run this idempotent CREATE TABLE IF NOT EXISTS plus a read-back
# check that fails the run loudly when the table is missing afterwards.
# Manual dispatch only, mirroring web-deploy.yml's use of the repo's
# CLOUDFLARE_API_TOKEN secret.
on:
  workflow_dispatch:
jobs:
  ddl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply account_supporters DDL
        run: npx -y wrangler@4 d1 execute openmusic-accounts --remote --command "CREATE TABLE IF NOT EXISTS account_supporters (user_id TEXT PRIMARY KEY, key_hash TEXT NOT NULL UNIQUE, tier TEXT NOT NULL DEFAULT 'bronze', verified_at TEXT NOT NULL)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify table exists (fail loud)
        run: |
          npx -y wrangler@4 d1 execute openmusic-accounts --remote --json --command "SELECT name FROM sqlite_master WHERE type='table' AND name='account_supporters'" | tee /tmp/verify.json
          grep -q "account_supporters" /tmp/verify.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
