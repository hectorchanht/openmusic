name: web-deploy
# Manual web deploy to Cloudflare Pages — the CI mirror of `pnpm deploy`
# (pnpm build && wrangler pages deploy .svelte-kit/cloudflare --project-name openmusic).
# Trigger: Actions tab -> web-deploy -> Run workflow. Uses the repo's
# CLOUDFLARE_API_TOKEN secret. Kept manual (workflow_dispatch only) so a
# push to main never deploys the site by surprise.
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # DEPLOY GATE (BTW-HOOK, quick-261122-npicon): regression checks that must pass on EVERY
      # deploy, not only in the unit suite. The manifest is package.json `test:gate` — add a check
      # there and both this workflow and `pnpm deploy` pick it up. Currently: PLAYSTATE-ICON
      # (play/pause glyph == real <audio> state; NowPlaying/Nowbar wiring).
      - name: Deploy gate (pnpm test:gate)
        run: pnpm test:gate
      - name: Set version
        run: echo "VITE_APP_VERSION=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
      - run: pnpm build
      - run: npx wrangler pages deploy .svelte-kit/cloudflare --project-name openmusic
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
